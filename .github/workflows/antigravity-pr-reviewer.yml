name: Antigravity SDK Compliance PR Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  compliance-review-sdk:
    name: Code Quality Review (SDK)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && 
      github.event.issue.pull_request != null && 
      startsWith(github.event.comment.body, '/review') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      statuses: read
      checks: read
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number) }}

      - name: Post Status Comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$EVENT_ACTION" = "opened" ]; then
            COMMENT_BODY=$(cat << 'EOF'
          👋 **Hello!** I'm the **Antigravity AI Code Reviewer**.

          I am currently analyzing your pull request changes, checking for code quality, architectural consistency, and potential issues.

          ### 📋 What to expect:
          - **In-line feedback & suggestions**: I will post review comments directly on your PR.
          - **Re-running a review**: If you make updates or want me to take another look, simply comment `/review` anywhere on this PR!
          EOF
            )
            gh issue comment "$PR_NUMBER" --repo "$REPO" --body "$COMMENT_BODY"
          elif [ "$EVENT_NAME" = "pull_request" ] && [ "$EVENT_ACTION" = "synchronize" ]; then
            gh issue comment "$PR_NUMBER" --repo "$REPO" --body "🔄 New changes detected. Re-running code quality and compliance review..."
          elif [ "$EVENT_NAME" = "issue_comment" ]; then
            gh api "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content='eyes' || true
            gh issue comment "$PR_NUMBER" --repo "$REPO" --body "👀 Review requested via comment. Starting review..."
          fi

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v3'
        with:
          create_credentials_file: true
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.GOOGLE_PROJECT_ID }}


      - name: Collect PR Data and Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p ./pr_assets
          gh pr view "$PR_NUMBER" --repo "$REPO" --json number,title,body,author,baseRefName,headRefName,files > ./pr_assets/pr_info.json
          gh pr diff "$PR_NUMBER" --repo "$REPO" > ./pr_assets/pr_diff.patch
          gh api graphql -F owner='${{ github.repository_owner }}' -F name='${{ github.event.repository.name }}' -F number="$PR_NUMBER" -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  comments(first: 100) {
                    nodes {
                      author { login }
                      body
                      createdAt
                    }
                  }
                }
              }
            }
          ' > ./pr_assets/pr_comments.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-antigravity "google-genai>=2.3.0"

      - name: Run Antigravity SDK Review
        env:
          REVIEWER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_PROJECT_ID: ${{ vars.GOOGLE_PROJECT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number || github.event.issue.number }}"
          REPO="${{ github.repository }}"
          PROMPT="Review pull request #$PR_NUMBER in repository $REPO. The PR details, diff, and comments have been collected into the following local assets:
          - ./pr_assets/pr_info.json (PR metadata and modified files)
          - ./pr_assets/pr_diff.patch (git diff of changes)
          - ./pr_assets/pr_comments.txt (existing comment thread)

          Please inspect these assets and write your review as comments directly on the PR using the gh CLI"
          echo "$PROMPT" | python .github/scripts/pr_review.py
